<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            height: 150px;
            width: 500px;
            background-color: aquamarine;
        }
          .box{
            height: 70px;
            width: 100px;
            background-color: rgb(136, 127, 255);
            transition: transform 3s ease-in-out;
        }

        .box:hover{
            transform: translateX(10vw) translateY(10vh);
        }
        

    </style>
</head>
<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>
</html>
